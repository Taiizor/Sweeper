[package]
name = "sweeper"
version = "0.1.0"
edition = "2021"
authors = ["Taiizor <https://github.com/Taiizor>"]
description = "A cross-platform CLI tool for cleaning temporary files and directories"
repository = "https://github.com/Taiizor/Sweeper"
license = "MIT"
readme = "README.md"
keywords = ["cli", "cleaner", "temp", "cache", "cross-platform"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env", "unicode", "color"] }
clap_complete = "4.5"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# File system operations
walkdir = "2.5"
glob = "0.3"
trash = "3.3"  # For safe deletion to recycle bin

# Progress indicators
indicatif = "0.17"

# Terminal colors
colored = "2.1"

# Byte size formatting
bytesize = "1.3"

# Time and date
chrono = "0.4"

# Platform-specific
dirs = "5.0"  # For getting system directories

# Internationalization
fluent = "0.16"
fluent-bundle = "0.15"
fluent-langneg = "0.13"
unic-langid = "0.9"

# Configuration
config = "0.14"

# Testing utilities
tempfile = "3.10"

# Additional dependencies
num_cpus = "1.16"
shellexpand = "3.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
mockall = "0.12"
criterion = "0.5"

[[bench]]
name = "performance"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
